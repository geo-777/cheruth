<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Protected Link</title>
    <style>
      * {
        box-sizing: border-box;
        font-family: sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f5f5;
      }

      .card {
        width: 100%;
        max-width: 400px;
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      }

      h2 {
        margin-top: 0;
        text-align: center;
      }

      p {
        text-align: center;
        color: #666;
        margin-bottom: 1.5rem;
      }

      input {
        width: 100%;
        padding: 0.9rem;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-bottom: 1rem;
      }

      button {
        width: 100%;
        padding: 0.9rem;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      .error {
        color: red;
        margin-top: 1rem;
        text-align: center;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Password Protected</h2>
      <p>Enter the password to access this link.</p>

      <form id="form">
        <input id="password" type="password" placeholder="Password" required />

        <button type="submit">Continue</button>
      </form>

      <div id="error" class="error">Incorrect password</div>
    </div>

    <script>
      const form = document.getElementById('form');
      const error = document.getElementById('error');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();

        error.style.display = 'none';

        const password = document.getElementById('password').value;

        const shortCode = window.location.pathname.slice(1);

        const response = await fetch('/api/verify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({
            shortCode,
            password,
          }),
        });

        if (response.ok) {
          const originalUrl = await response.text();
          window.location.href = originalUrl;
        } else {
          error.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
